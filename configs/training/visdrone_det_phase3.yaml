# Phase 3 training policy. The generated Ultralytics dataset YAML is written
# beside each experiment so the immutable source data is never rewritten.
input_size_px: 640
seed: 20260831
epochs: 100
# Fixed after AutoBatch's CUDA profiling terminated on the Phase 3 RTX 3070
# host. A one-epoch batch-8 probe completed without OOM retries; batch 16 did
# not. This explicit value makes the run reproducible on the validated host.
batch: 8
workers: 4
# Letterbox to a square 640x640 input; do not crop or stretch source frames.
rect: false
deterministic: true
amp: false
# Restrained aerially plausible augmentation. In particular, no perspective,
# vertical flip, mosaic, mixup, copy-paste, or random erasing is used.
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3
degrees: 5.0
translate: 0.05
scale: 0.25
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
erasing: 0.0
