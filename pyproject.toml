[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wam_drones"
version = "0.1.0"
description = "Low-cost onboard aerial object detection and tracking"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0.12,<7",
]
detection = [
  "lap==0.5.12",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "ultralytics==8.4.135",
]
dataset = [
  "pillow>=10,<12",
]
vlm-inference = [
  "pillow>=10,<12",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "transformers>=4.57,<5",
  "accelerate>=1.0,<2",
  "lm-format-enforcer>=0.11,<1",
  "num2words>=0.5.14,<1",
]

[project.scripts]
wam-detect = "wam_drones.detection.cli:main"
wam-dataset = "wam_drones.dataset.cli:main"
wam-vlm = "wam_drones.vlm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wam_drones"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wam_drones"]

[[tool.mypy.overrides]]
module = ["cv2", "onnx", "ultralytics"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true
